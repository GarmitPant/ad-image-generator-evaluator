[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-image-generator-evaluator"
version = "0.1.0"
description = "Auditable, generation-first ad image pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5", "Pillow==12.3.0", "openai==2.54.0",
  "google-genai==2.25.0", "PyYAML>=6.0.2,<7", "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.9"]
# Local evaluator models. Not needed for offline tests or CI.
eval = [
  "torch==2.14.0", "torchvision==0.29.0", "transformers==5.17.0", "huggingface-hub==1.33.0",
  "paddlepaddle==3.3.1", "paddleocr==3.7.0",
]

[project.scripts]
adgen = "adgen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"adgen.state" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
